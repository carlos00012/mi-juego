name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Lint y build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar herramientas (Rokit)
        uses: CompeyDev/setup-rokit@v0.2.1

      - name: Formato
        run: stylua --check src

      - name: Lint
        run: selene src

      - name: Compilar lugar
        run: rojo build default.project.json -o build/mi-juego.rbxlx

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: mi-juego-place
          path: build/mi-juego.rbxlx
